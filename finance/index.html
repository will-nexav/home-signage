<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a11;
    --panel: #0b121d;
    --panel-hi: #101a29;
    --line: #1b2a3e;
    --text: #e6f0ff;
    --muted: #7d8fa9;
    --cyan: #38e1ff;
    --green: #2ee59d;
    --red: #ff5c7a;
    --amber: #ffb547;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { color: var(--text); font-family: Inter, system-ui, sans-serif; }
  .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    padding: 40px 64px 0;
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
    grid-template-rows: auto 1fr 300px 76px;
    gap: 26px 28px;
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 80px 80px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 80px 80px,
      var(--bg);
    background-blend-mode: normal;
  }
  #stage::before { /* fade the grid so it stays subtle */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, #060a11cc 0%, #060a11f2 70%);
  }
  #stage > * { position: relative; }
  .panel {
    background: linear-gradient(180deg, var(--panel-hi), var(--panel));
    border: 2px solid var(--line); border-radius: 16px;
    box-shadow: 0 0 0 1px #00000066, 0 20px 40px #00000080;
    padding: 30px 38px;
  }
  .label { font-size: 26px; font-weight: 700; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
  .up { color: var(--green); } .down { color: var(--red); } .flat { color: var(--muted); }

  /* Header */
  header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 60px; font-weight: 800; letter-spacing: 2px; }
  header h1 span { color: var(--cyan); }
  .hright { display: flex; align-items: center; gap: 40px; font-size: 38px; color: var(--muted); font-weight: 700; }
  #clock { color: var(--text); }
  .live { display: flex; align-items: center; gap: 14px; font-size: 28px; letter-spacing: 3px; color: var(--green); }
  .live i { width: 18px; height: 18px; border-radius: 50%; background: var(--green); box-shadow: 0 0 16px var(--green); animation: blink 2s infinite; }
  .live.warn { color: var(--red); } .live.warn i { background: var(--red); box-shadow: 0 0 16px var(--red); }
  @keyframes blink { 50% { opacity: .25; } }
  #demo { display: none; background: var(--red); color: #fff; font-size: 24px; letter-spacing: 3px; padding: 6px 16px; border-radius: 8px; }

  /* Net worth hero */
  #hero { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 30px; align-items: center; }
  #nw { font-size: 128px; font-weight: 800; letter-spacing: -3px; line-height: 1; margin: 18px 0 14px; text-shadow: 0 0 40px #38e1ff33; }
  #nwChange { font-size: 33px; font-weight: 700; white-space: nowrap; }
  .goalrow { display: flex; justify-content: space-between; font-size: 30px; color: var(--muted); font-weight: 700; margin: 34px 0 12px; }
  .goalrow b { color: var(--text); }
  .track { height: 26px; background: #0a0f18; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
  .fill { height: 100%; border-radius: 12px; background: linear-gradient(90deg, #1d8fff, var(--cyan)); box-shadow: 0 0 20px #38e1ff88; transition: width 1.2s; }
  #donut { width: 400px; height: 400px; }
  #donut text { font-family: "JetBrains Mono", monospace; }

  /* Revenue */
  #rev { display: flex; flex-direction: column; justify-content: space-between; }
  #rev .label { color: var(--amber); }
  #bizList { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; }
  .biz .top { display: flex; justify-content: space-between; align-items: baseline; }
  .biz .bname { font-size: 36px; font-weight: 800; }
  .biz .bpct { font-size: 40px; font-weight: 800; color: var(--amber); }
  .biz .bval { font-size: 54px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 14px; }
  .biz .bval small { font-size: 28px; color: var(--muted); font-weight: 700; letter-spacing: 0; }
  .biz .track { height: 20px; }
  .biz .fill { background: linear-gradient(90deg, #ff8a3d, var(--amber)); box-shadow: 0 0 16px #ffb54788; }
  .biz.na .bval { color: var(--muted); font-size: 38px; }

  /* Account cards */
  #cards { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
  .card { display: flex; flex-direction: column; justify-content: space-between; padding: 26px 30px; border-top: 6px solid var(--c); }
  .card .name { font-size: 32px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
  .card .name .chg { font-size: 26px; }
  .card .val { font-size: 58px; font-weight: 800; letter-spacing: -1px; }
  .card .goal { font-size: 25px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 10px; }
  .card .track { height: 18px; }
  .card .fill { background: var(--c); box-shadow: 0 0 14px var(--c); }

  /* Ticker */
  #ticker { grid-column: 1 / -1; margin: 0 -64px; border-top: 2px solid var(--line); background: #08101b; overflow: hidden; display: flex; align-items: center; }
  #tape { display: flex; white-space: nowrap; animation: scroll 40s linear infinite; font-size: 30px; font-weight: 700; }
  #tape span { padding: 0 44px; }
  #tape span b { color: var(--muted); margin-right: 14px; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>FINANCE<span>.</span></h1>
    <div class="hright">
      <span id="demo">DEMO</span>
      <span class="live" id="live"><i></i><span id="liveText">LIVE</span></span>
      <span id="date">&nbsp;</span>
      <span id="clock" class="mono">&nbsp;</span>
    </div>
  </header>

  <section class="panel" id="hero">
    <div>
      <div class="label">Net Worth</div>
      <div id="nw" class="mono">&nbsp;</div>
      <div id="nwChange" class="mono">&nbsp;</div>
      <div class="goalrow"><span>Goal <b id="nwGoal" class="mono"></b></span><span id="nwPct" class="mono"></span></div>
      <div class="track"><div class="fill" id="nwFill" style="width:0"></div></div>
    </div>
    <svg id="donut" viewBox="0 0 400 400"></svg>
  </section>

  <section class="panel" id="rev">
    <div class="label">Business Revenue</div>
    <div id="bizList"></div>
  </section>

  <section id="cards"></section>

  <div id="ticker"><div id="tape"></div></div>
</div>

<script>
/* =========================================================
   SETTINGS
   Page address: https://will-nexav.github.io/home-signage/finance/?sheet=<published CSV link>
   Add &private=1 to hide dollar amounts and show only percentages.
   Sheet columns (found by header name): Item | Group | Current | Goal | Last Month
   - Accounts with the same Group are added together into one card (max 5 cards).
   - Group "Revenue" (or "Business") rows show in the revenue panel and are NOT added to net worth.
   - Group "Goal" sets the net worth goal (put it in the Goal column).
   ========================================================= */
const params = new URLSearchParams(location.search);
const SHEET_CSV_URL = params.get('sheet') || '';
const PRIVATE = params.get('private') === '1';
const TZ = 'America/New_York';
const REFETCH_MINUTES = 5;
const CACHE_KEY = 'finance.lastGood';
const COLORS = { chase: '#4f8cff', cash: '#2ee59d', crypto: '#f7931a', btc: '#f7931a', bitcoin: '#f7931a', stock: '#a78bfa', retire: '#38e1ff', ira: '#38e1ff', asset: '#ff7ab6' };
const FALLBACK_COLORS = ['#4f8cff', '#2ee59d', '#f7931a', '#a78bfa', '#38e1ff', '#ff7ab6'];

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener('resize', fit); fit();

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => { const n = parseFloat(String(v || '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : null; };
const MASK = '•••••';
const full = n => PRIVATE ? MASK : (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const compact = n => {
  if (PRIVATE) return MASK;
  const a = Math.abs(n), sign = n < 0 ? '-' : '';
  if (a >= 1e6) return sign + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e3) return sign + '$' + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K';
  return sign + '$' + Math.round(a);
};
const pct = (a, b) => b ? Math.max(0, a / b * 100) : 0;
function change(cur, last) {
  if (last == null || !last) return { cls: 'flat', txt: '— vs last month', short: '—' };
  const d = cur - last, p = d / Math.abs(last) * 100;
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat', arrow = d > 0 ? '▲' : d < 0 ? '▼' : '■';
  const money = PRIVATE ? '' : ` ${d >= 0 ? '+' : '-'}${compact(Math.abs(d))}`;
  return { cls, txt: `${arrow}${money} (${p >= 0 ? '+' : ''}${p.toFixed(1)}%) vs last month`, short: `${arrow} ${Math.abs(p).toFixed(1)}%` };
}
const colorFor = (name, i) => { const k = Object.keys(COLORS).find(k => name.toLowerCase().includes(k)); return k ? COLORS[k] : FALLBACK_COLORS[i % FALLBACK_COLORS.length]; };

/* ---------- Read the sheet ---------- */
function parseCSV(text) {
  const rows = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const cells = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
      else if (c === '"') q = true; else if (c === ',') { cells.push(cur); cur = ''; } else cur += c;
    }
    cells.push(cur); rows.push(cells);
  }
  return rows;
}
function toItems(rows) {
  const head = (rows[0] || []).map(h => h.trim().toLowerCase());
  const col = (name, fb) => { const i = head.findIndex(h => h.startsWith(name)); return i >= 0 ? i : fb; };
  const cI = col('item', 0), cGr = col('group', -1), cC = col('current', 1), cG = col('goal', 2), cL = col('last', 3);
  return rows.slice(1).map(r => {
    const name = (r[cI] || '').trim();
    return { name, group: (cGr >= 0 && (r[cGr] || '').trim()) || name, cur: num(r[cC]), goal: num(r[cG]), last: num(r[cL]) };
  }).filter(x => x.name && (x.cur != null || x.goal != null));
}
const DEMO = [ // sample numbers only, never real data
  { name: 'Checking', group: 'Chase', cur: 18400, goal: 25000, last: 16900 },
  { name: 'Savings', group: 'Cash', cur: 9200, goal: 15000, last: 8800 },
  { name: 'BTC', group: 'Crypto', cur: 41300, goal: 60000, last: 37800 },
  { name: 'ETH', group: 'Crypto', cur: 3100, goal: null, last: 3300 },
  { name: 'Brokerage', group: 'Stocks', cur: 28750, goal: 40000, last: 27100 },
  { name: 'IRA', group: 'Retirement', cur: 22000, goal: 30000, last: 21400 },
  { name: 'Net Worth', group: 'Goal', cur: null, goal: 200000, last: null },
  { name: 'Business A', group: 'Revenue', cur: 212000, goal: 300000, last: null },
  { name: 'Business B', group: 'Revenue', cur: null, goal: 500000, last: null },
];

/* ---------- Draw ---------- */
function ring(svg, size, stroke, segments, center) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r, c = size / 2;
  let out = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#132033" stroke-width="${stroke}"/>`;
  let off = 0;
  for (const s of segments) {
    const len = Math.max(0, Math.min(1, s.frac)) * C;
    const gap = segments.length > 1 ? Math.min(6, len) : 0;
    out += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}"
      stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"
      style="filter: drop-shadow(0 0 8px ${s.color}88)" ${segments.length === 1 ? 'stroke-linecap="round"' : ''}/>`;
    off += len;
  }
  svg.innerHTML = out + center;
}

function render(items, statusText, warn) {
  const isRev = x => /revenue|business/i.test(x.group);
  const isGoal = x => /^goal/i.test(x.group);
  const accounts = items.filter(x => !isRev(x) && !isGoal(x) && x.cur != null);
  const biz = items.filter(isRev);

  // Add accounts with the same Group together
  const groups = [];
  for (const a of accounts) {
    let g = groups.find(g => g.name.toLowerCase() === a.group.toLowerCase());
    if (!g) groups.push(g = { name: a.group, cur: 0, goal: null, last: null, lastAll: true });
    g.cur += a.cur;
    if (a.goal != null) g.goal = (g.goal || 0) + a.goal;
    if (a.last != null) g.last = (g.last || 0) + a.last; else g.lastAll = false;
  }
  groups.forEach(g => { if (!g.lastAll) g.last = null; });
  const personal = groups;

  // Net worth
  const nw = personal.reduce((a, x) => a + x.cur, 0);
  const goalRow = items.find(isGoal);
  const nwGoal = goalRow ? (goalRow.goal ?? goalRow.cur ?? 0) : personal.reduce((a, x) => a + (x.goal || 0), 0);
  const nwLast = personal.length && personal.every(x => x.last != null) ? personal.reduce((a, x) => a + x.last, 0) : null;
  const ch = change(nw, nwLast);
  $('nw').textContent = PRIVATE ? (nwGoal ? pct(nw, nwGoal).toFixed(1) + '%' : MASK) : full(nw);
  $('nwChange').className = 'mono ' + ch.cls; $('nwChange').textContent = nwLast == null ? '' : ch.txt;
  document.querySelector('.goalrow').style.visibility = nwGoal ? '' : 'hidden';
  document.querySelector('#hero .track').style.visibility = nwGoal ? '' : 'hidden';
  $('nwGoal').textContent = PRIVATE ? '' : full(nwGoal);
  $('nwPct').textContent = pct(nw, nwGoal).toFixed(1) + '% of goal';
  $('nwFill').style.width = Math.min(100, pct(nw, nwGoal)) + '%';

  // Allocation donut
  const pos = personal.filter(x => x.cur > 0), tot = pos.reduce((a, x) => a + x.cur, 0) || 1;
  ring($('donut'), 400, 46, pos.map((x, i) => ({ frac: x.cur / tot, color: colorFor(x.name, personal.indexOf(x)) })),
    `<text x="200" y="185" text-anchor="middle" font-size="26" font-weight="700" fill="#7d8fa9" letter-spacing="3">ALLOCATION</text>
     <text x="200" y="235" text-anchor="middle" font-size="44" font-weight="800" fill="#e6f0ff">${accounts.length} accounts</text>`);

  // Business revenue
  $('rev').style.display = biz.length ? '' : 'none';
  $('bizList').innerHTML = biz.slice(0, 3).map(b => {
    if (b.cur == null) return `<div class="biz na"><div class="top"><span class="bname">${esc(b.name)}</span><span class="bpct mono">—</span></div>
      <div class="bval mono">Not tracked yet${b.goal && !PRIVATE ? ` <small>· goal ${compact(b.goal)}</small>` : ''}</div><div class="track"><div class="fill" style="width:0"></div></div></div>`;
    const p = pct(b.cur, b.goal);
    return `<div class="biz"><div class="top"><span class="bname">${esc(b.name)}</span><span class="bpct mono">${b.goal ? Math.round(p) + '%' : ''}</span></div>
      <div class="bval mono">${compact(b.cur)}${b.goal && !PRIVATE ? ` <small>/ ${compact(b.goal)}</small>` : ''}</div>
      <div class="track"><div class="fill" style="width:${Math.min(100, p)}%"></div></div></div>`;
  }).join('');

  // Cards
  $('cards').innerHTML = personal.slice(0, 5).map((x, i) => {
    // No goal on this card? Show its share of the portfolio instead
    const share = nw > 0 ? Math.max(0, x.cur / nw * 100) : 0;
    const p = x.goal ? pct(x.cur, x.goal) : share, c = change(x.cur, x.last);
    return `<div class="panel card" style="--c:${colorFor(x.name, i)}">
      <div class="name"><span>${esc(x.name)}</span><span class="chg mono ${c.cls}">${x.last == null ? '' : c.short}</span></div>
      <div class="val mono">${PRIVATE ? Math.round(p) + '%' : compact(x.cur)}</div>
      <div><div class="goal mono"><span>${x.goal ? (PRIVATE ? 'to goal' : 'Goal ' + compact(x.goal)) : 'of portfolio'}</span><span>${!PRIVATE ? Math.round(p) + '%' : ''}</span></div>
      <div class="track"><div class="fill" style="width:${Math.min(100, p)}%"></div></div></div>
    </div>`;
  }).join('');

  // Ticker (content doubled so the loop is seamless)
  const tick = [...accounts, ...biz.filter(b => b.cur != null)].map(x => { const c = change(x.cur, x.last); return `<span><b>${esc(x.name.toUpperCase())}</b>${PRIVATE ? '' : compact(x.cur) + ' '}<em class="${c.cls}" style="font-style:normal">${c.short}</em></span>`; }).join('')
    + `<span><b>NET WORTH</b>${PRIVATE ? '' : compact(nw) + ' '}<em class="${ch.cls}" style="font-style:normal">${ch.short}</em></span>`
    + `<span><b>STATUS</b>${esc(statusText)}</span>`;
  $('tape').innerHTML = tick + tick;
  $('tape').classList.add('mono');

  $('live').className = 'live' + (warn ? ' warn' : '');
  $('liveText').textContent = warn ? 'OFFLINE' : 'LIVE';
}

function tickClock() {
  const now = new Date();
  $('clock').textContent = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(now);
  $('date').textContent = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' }).format(now);
}

async function load() {
  const time = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(new Date());
  if (!SHEET_CSV_URL) { $('demo').style.display = 'inline-block'; render(DEMO, 'Demo data. No sheet connected yet', true); return; }
  try {
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const items = toItems(parseCSV(await res.text()));
    if (!items.length) throw new Error('empty');
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ items, time })); } catch (e) {}
    render(items, `Updated ${time}`);
  } catch (err) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) {}
    if (cached) render(cached.items, `Can't reach the sheet. Data from ${cached.time}`, true);
    else { $('demo').style.display = 'inline-block'; render(DEMO, "Can't reach the sheet. Showing demo data", true); }
  }
}

tickClock(); setInterval(tickClock, 20 * 1000);
load(); setInterval(load, REFETCH_MINUTES * 60 * 1000);
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
</script>
</body>
</html>
